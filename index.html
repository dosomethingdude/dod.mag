        .modal-image {
            width: 100%;
            aspect-ratio: 16/9;
            background: #e8e8e8;
            overflow: hidden;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-body {
            padding: 80px;
        }

        .modal-category {
            font-size: 11px;
            color: #999;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .modal-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 24px;
            line-height: 1.2;
            color: #1a1a1a;
            letter-spacing: -0.02em;
        }

        .modal-date {
            font-size: 13px;
            color: #999;
            margin-bottom: 48px;
            padding-bottom: 48px;
            border-bottom: 1.5px solid #e8e8e8;
            letter-spacing: 0.03em;
        }

        .modal-text {
            font-size: 17px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }

        .close-modal {
            position: absolute;
            top: 32px;
            right: 32px;
            font-size: 32px;
            color: #fff;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            border: none;
            padding: 0;
            width: 48px;
            height: 48px;
            line-height: 1;
            z-index: 10;
            border-radius: 50%;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            background: rgba(0,0,0,0.7);
            transform: rotate(90deg);
        }

        /* 공감 & 공유 플로팅 바 */
        .modal-actions {
            position: fixed;
            right: calc(50% - 540px);
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1001;
        }

        .modal-action-btn {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            max-width: 44px;
            max-height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.95);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            transition: all 0.3s;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        .modal-action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .like-btn.liked {
            background: #fff0f0;
        }

        .like-count {
            font-size: 11px;
            color: #999;
            text-align: center;
            font-weight: 600;
            line-height: 1;
        }

        .share-menu {
            display: none;
            position: fixed;
            z-index: 1002;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #fff;
            border-radius: 24px;
            padding: 12px 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        }

        .share-menu.active {
            display: flex;
        }

        .share-option {
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            background: #f5f5f5;
            padding: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .share-option:hover {
            transform: scale(1.12);
            background: #eee;
        }

        .copy-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
            pointer-events: none;

        .copy-toast.show {

        @media (max-width: 1200px) {

            }

                font-size: 36px;
            }

                padding: 60px 40px;
            }

        @media (max-width: 600px) {

        @media (max-width: 400px) {

                padding: 0 12px;
            }
            .logo {
                font-size: 20px;

                gap: 6px;
            }

        /* 언어 선택 버튼 */
        .lang-selector {

        }

        .lang-btn {

        .lang-btn:hover {

        }

            border-color: #1a1a1a;
        }

        /* 카테고리 페이지 */
        .category-page {
            display: none;
            padding-top: 40px;
        }

        .category-page.active {
            display: block;
        }

        .category-page-header {
            margin-bottom: 60px;
            padding-bottom: 32px;
            border-bottom: 2px solid #1a1a1a;
        }

        .category-page-title {
            font-size: 56px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .category-page-desc {
            font-size: 16px;
            color: #666;
            line-height: 1.7;
        }

        .back-to-home {
            display: inline-flex;

        @media (max-width: 1200px) {
            .category-posts-grid {

                gap: 32px;
            }
        }

        @media (max-width: 900px) {

            }

                width: 44px;

            }

        /* 푸터 스타일 */
        footer {
            background: #1a1a1a;
            color: #999;
            padding: 60px 0 40px;
            margin-top: 120px;
        }

        .footer-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 60px;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #333;
        }

        .footer-logo {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .footer-links {
            display: flex;
            gap: 32px;
        }

        .footer-links a {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .footer-copyright {
            color: #666;
        }

        @media (max-width: 768px) {
            .footer-top {
                flex-direction: column;
                gap: 24px;
            }
            .footer-links {
                flex-wrap: wrap;
                gap: 16px;
            }
            .footer-bottom {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
        }

        /* 약관 페이지 스타일 */
        .legal-page {
            display: none;
            padding-top: 40px;
            padding-bottom: 80px;
        }

        .legal-page.active {
            display: block;
        }

        .legal-header {
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 2px solid #1a1a1a;
        }

        .legal-title {
            font-size: 42px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 16px;
        }

        .legal-updated {
            font-size: 14px;
            color: #999;
        }

        .legal-content {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }

        .legal-content h2 {
            font-size: 20px;
            font-weight: 700;
            margin-top: 40px;
            margin-bottom: 16px;
            color: #1a1a1a;
        }

        .legal-content h3 {
            font-size: 17px;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        /* 관리자 약관 편집 섹션 */
        .admin-legal-section {
            margin-top: 60px;
            padding-top: 60px;
            border-top: 1px solid #e8e8e8;
        }

        .admin-legal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #1a1a1a;
        }

        .legal-edit-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .legal-tab-btn {
            padding: 12px 24px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .legal-tab-btn.active {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }

        .legal-tab-btn:hover:not(.active) {
            background: #e8e8e8;
        }

        .legal-editor {
            display: none;
        }

        .legal-editor.active {
            display: block;
        }

        .legal-textarea {
            width: 100%;
            min-height: 400px;
            padding: 20px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.7;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 16px;
        }

        .legal-textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .legal-save-btn {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .legal-save-btn:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo-wrapper">
                <button class="secret-btn" id="secretBtn"></button>
                <a href="#" class="logo" onclick="goToHome(event)">dod.mag</a>
                <span class="admin-badge" id="adminBadge" style="display: none;">관리자</span>
            </div>
            <nav>
                <a href="#" onclick="openCategoryPage('경제')" data-i18n="nav_products">경제</a>
                <div class="lang-selector">
                    <button class="lang-btn active" onclick="setLanguage('ko')">KO</button>
                    <button class="lang-btn" onclick="setLanguage('en')">EN</button>
                </div>
                <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()" data-i18n="nav_logout">로그아웃</button>
            </nav>
        </div>
    </header>

    <div class="login-modal" id="loginModal">
        <div class="login-content">
            <h2 class="login-title">관리자 로그인</h2>
            <input type="password" class="login-input" id="passwordInput" placeholder="비밀번호를 입력하세요">
            <button class="login-btn" onclick="login()">로그인</button>
            <button class="cancel-btn" onclick="closeLogin()">취소</button>
        </div>
    </div>

    <div class="subscribe-modal" id="subscribeModal">
        <div class="subscribe-content">
            <div class="subscribe-logo">dod.mag</div>
            <p class="subscribe-description">
                레터를 구독하시면 2주에 한 번<br>
                다양한 콘텐츠와 정보를 전해드립니다.
            </p>
            <form class="subscribe-form" id="subscribeForm">
                <div class="form-group">
                    <label class="form-label">성함</label>
                    <input type="text" class="form-input" id="subscribeName" placeholder="홍길동" required>
                </div>
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="subscribeEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">회사 (선택)</label>
                    <input type="text" class="form-input" id="subscribeCompany" placeholder="회사명">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" class="checkbox-input" id="agreeCheckbox" required>
                    <label class="checkbox-label" for="agreeCheckbox">
                        마케팅 활동을 위한 개인정보 수집 및 이용에 동의합니다.
                    </label>
                </div>
                <button type="submit" class="submit-subscribe-btn">구독하기</button>
                <button type="button" class="close-subscribe-btn" onclick="closeSubscribeModal()">취소</button>
            </form>
        </div>
    </div>

    <div class="hero-banner">
        <div class="carousel-container" id="carouselContainer"></div>
        <button class="carousel-arrow left" onclick="moveCarousel(-1)">‹</button>
        <button class="carousel-arrow right" onclick="moveCarousel(1)">›</button>
        <div class="carousel-nav" id="carouselNav"></div>
    </div>

    <div class="admin-section" id="adminSection">
        <div class="admin-inner">
            <h2 class="admin-title" id="formTitle">새 글 작성</h2>
            <form id="postForm" class="form-grid">
                <input type="hidden" id="editingPostId">
                <div>
                    <label>카테고리</label>
                    <select id="category" required>
                        <option value="">선택하세요</option>
                        <option value="경제">경제</option>
                    </select>
                </div>
                <div>
                    <label>제목</label>
                    <input type="text" id="title" placeholder="제목을 입력하세요" required>
                </div>
                <div>
                    <label>이미지 업로드</label>
                    <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                        <input type="file" id="imageInput" accept="image/*">
                        <p id="uploadText">클릭하여 이미지 선택</p>
                        <img id="previewImg" class="preview-img">
                    </div>
                </div>
                <div>
                    <label>프롤로그 (2-3줄 요약)</label>
                    <textarea id="summary" placeholder="글의 핵심 내용을 2-3줄로 요약해주세요" required></textarea>
                </div>
                <div>
                    <label>본문</label>
                    <textarea id="content" placeholder="전체 글 내용을 입력하세요" required style="min-height: 240px;"></textarea>
                </div>
                <div>
                    <button type="submit" id="submitBtn">발행하기</button>
                    <button type="button" onclick="cancelEdit()" id="cancelBtn" style="display: none; margin-left: 16px; background: #666;">취소</button>
                </div>
            </form>

            <!-- 약관 편집 섹션 -->
            <div class="admin-legal-section" id="adminLegalSection">
                <h2 class="admin-title">약관 관리</h2>
                <div class="legal-edit-tabs">
                    <button class="legal-tab active" onclick="switchLegalTab('privacy')">개인정보처리방침</button>
                    <button class="legal-tab" onclick="switchLegalTab('terms')">이용약관</button>
                </div>
                <div class="legal-edit-content" id="privacyEditContent">
                    <label>개인정보처리방침 내용</label>
                    <textarea class="legal-textarea" id="privacyTextarea" placeholder="개인정보처리방침 내용을 입력하세요"></textarea>
                    <button class="legal-save-btn" onclick="saveLegalContent('privacy')">저장하기</button>
                </div>
                <div class="legal-edit-content" id="termsEditContent" style="display: none;">
                    <label>이용약관 내용</label>
                    <textarea class="legal-textarea" id="termsTextarea" placeholder="이용약관 내용을 입력하세요"></textarea>
                    <button class="legal-save-btn" onclick="saveLegalContent('terms')">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="category-section" id="products-section">
            <div class="section-header">
                <h2 class="section-title" data-i18n="cat_products">경제</h2>
                <a href="#" class="view-all" onclick="openCategoryPage('경제')" data-i18n="view_all">전체보기 →</a>
            </div>
            <div class="posts-grid" id="products-grid"></div>
        </section>

    </div>

    <!-- 카테고리 전체보기 페이지 -->
    <div class="category-page" id="categoryPage">
        <div class="container">
            <a href="#" class="back-to-home" onclick="closeCategoryPage()">← <span data-i18n="back_home">홈으로 돌아가기</span></a>
            <div class="category-page-header">
                <h1 class="category-page-title" id="categoryPageTitle"></h1>
                <p class="category-page-desc" id="categoryPageDesc"></p>
            </div>
            <div class="category-posts-grid" id="categoryPostsGrid"></div>
        </div>
    </div>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="modal-image" id="modalImage"></div>
            <div class="modal-body">
                <div class="modal-category" id="modalCategory"></div>
                <h1 class="modal-title" id="modalTitle"></h1>
                <div class="modal-date" id="modalDate"></div>
                <div class="modal-text" id="modalContent"></div>
            </div>
        </div>
        <!-- 공감 & 공유 플로팅 바 -->
        <div class="modal-actions" id="modalActions" style="display:none;">
            <button class="modal-action-btn like-btn" id="likeBtn" onclick="toggleLike()" title="공감">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <div class="like-count" id="likeCount"></div>
            <button class="modal-action-btn share-btn" id="shareBtn" onclick="toggleShareMenu()" title="공유하기">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </button>
        </div>
    </div>

    <!-- 공유 메뉴 (모달 바깥) -->
    <div class="share-menu" id="shareMenu">
        <button class="share-option" onclick="shareTwitter(event)" title="X (Twitter)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </button>
        <button class="share-option" onclick="shareFacebook(event)" title="Facebook">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </button>
        <button class="share-option" onclick="copyLink(event)" title="링크 복사">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
    </div>
    <div class="copy-toast" id="copyToast">링크가 복사되었습니다</div>

    <!-- 개인정보처리방침 페이지 -->
    <div class="legal-page" id="privacyPage">
        <div class="container">
            <a href="#" class="back-to-home" onclick="closeLegalPage(event)">← <span data-i18n="back_home">홈으로 돌아가기</span></a>
            <div class="legal-header">
                <h1 class="legal-title" id="privacyTitle">개인정보처리방침</h1>
                <p class="legal-updated" id="privacyUpdated"></p>
            </div>
            <div class="legal-content" id="privacyContent"></div>
        </div>
    </div>

    <!-- 이용약관 페이지 -->
    <div class="legal-page" id="termsPage">
        <div class="container">
            <a href="#" class="back-to-home" onclick="closeLegalPage(event)">← <span data-i18n="back_home">홈으로 돌아가기</span></a>
            <div class="legal-header">
                <h1 class="legal-title" id="termsTitle">이용약관</h1>
                <p class="legal-updated" id="termsUpdated"></p>

    <!-- 푸터 -->
    <footer id="mainFooter">
        <div class="footer-inner">
            <div class="footer-top">
                <div class="footer-logo">dod.mag</div>
                <div class="footer-links">
                    <a href="#" onclick="openLegalPage('privacy', event)" data-i18n="footer_privacy">개인정보처리방침</a>
                    <a href="#" onclick="openLegalPage('terms', event)" data-i18n="footer_terms">이용약관</a>
                </div>
            </div>
            <div class="footer-bottom">
                <div class="footer-copyright">© 2026 dod.mag. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script>
        let posts = [];
        let currentImageData = null;
        let isAdmin = false;
        let clickCount = 0;
        let clickTimer = null;
        let currentSlide = 0;
        let carouselInterval = null;
        let currentModalPostId = null;

        const categoryMap = {
            '경제': 'products'
        };

        // posts.json에서 게시글 불러오기 (Gemini 자동화 연동용)
        async function loadPosts() {
            const savedPosts = localStorage.getItem('dodmagPosts');

            try {
                // posts.json에서 데이터 불러오기 (캐시 버스팅 적용)
                const response = await fetch('posts.json?v=' + Date.now());
                if (response.ok) {
                    const jsonPosts = await response.json();

                    // LocalStorage에 저장된 게시글과 병합 (관리자가 추가한 글 유지)
                    if (savedPosts) {
                        const localPosts = JSON.parse(savedPosts);
                        const jsonIds = jsonPosts.map(p => p.id);
                        const localOnlyPosts = localPosts.filter(p => !jsonIds.includes(p.id));
                        posts = [...jsonPosts, ...localOnlyPosts];
                    } else {
                        posts = jsonPosts;
                    }

                    // ID 기준 정렬 (최신순)
                    posts.sort((a, b) => b.id - a.id);
                    savePosts();
                } else {
                    throw new Error('posts.json not found');
                }
            } catch (error) {
                console.log('posts.json 로드 실패, LocalStorage 사용:', error);
                // posts.json 로드 실패 시 기존 방식 사용
                if (savedPosts) {
                    posts = JSON.parse(savedPosts);
                } else {
                    // 초기 샘플 데이터 (폴백)
                    posts = [];
                    savePosts();
                }
            }
        }

        function savePosts() {
            localStorage.setItem('dodmagPosts', JSON.stringify(posts));
        }

        function updateCarousel() {
            const latestPosts = posts.slice(0, 5);
            const container = document.getElementById('carouselContainer');
            const nav = document.getElementById('carouselNav');

            if (latestPosts.length === 0) {
                const welcomeTitle = currentLang === 'en' ? 'A Space for<br>Everyday Discoveries' : '일상 속 새로운 발견을<br>기록하는 공간';
                const welcomeSummary = currentLang === 'en' ? 'New products, new brands, and insights on a healthy balanced life' : '새로운 제품, 새로운 브랜드, 그리고 건강한 균형잡힌 삶에 대한 통찰';
                container.innerHTML = `<div class="carousel-slide active"><div class="carousel-overlay"></div><div class="carousel-content"><div class="carousel-category">Welcome</div><h1 class="carousel-title">${welcomeTitle}</h1><p class="carousel-summary">${welcomeSummary}</p></div></div>`;
                nav.innerHTML = '';
                if (carouselInterval) clearInterval(carouselInterval);
                return;
            }

            container.innerHTML = latestPosts.map((post, index) => {
                const translatedCategory = categoryTranslations[currentLang][post.category] || post.category;
                return `<div class="carousel-slide ${index === 0 ? 'active' : ''}" onclick="openModal(${post.id})">${post.image ? '<img src="' + post.image + '" class="carousel-image">' : ''}<div class="carousel-overlay"></div><div class="carousel-content"><div class="carousel-category">${translatedCategory}</div><h2 class="carousel-title">${getPostText(post, 'title')}</h2><p class="carousel-summary">${getPostText(post, 'summary')}</p></div></div>`;
            }).join('');

            nav.innerHTML = latestPosts.map((_, index) => `<div class="carousel-dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>`).join('');

            currentSlide = 0;
            startCarousel();
        }

        function moveCarousel(direction) {
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.carousel-dot');
            if (slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            if (dots[currentSlide]) dots[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            if (dots[currentSlide]) dots[currentSlide].classList.add('active');
            resetCarousel();
        }

        function goToSlide(index) {
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.carousel-dot');
            if (slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            if (dots[currentSlide]) dots[currentSlide].classList.remove('active');
            currentSlide = index;
            slides[currentSlide].classList.add('active');
            if (dots[currentSlide]) dots[currentSlide].classList.add('active');
            resetCarousel();
        }

        function startCarousel() {
            if (carouselInterval) clearInterval(carouselInterval);
            const slides = document.querySelectorAll('.carousel-slide');
            if (slides.length > 1) {
                carouselInterval = setInterval(() => moveCarousel(1), 5000);
            }
        }

        function resetCarousel() {
            startCarousel();
        }

        document.getElementById('secretBtn').addEventListener('click', function() {
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);
            if (clickCount === 3) {
                document.getElementById('loginModal').style.display = 'block';
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => clickCount = 0, 1000);
            }
        });

        function login() {
            const password = document.getElementById('passwordInput').value;
            if (password === 'admin1991') {
                isAdmin = true;
                document.getElementById('adminBadge').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('adminSection').classList.add('active');
                closeLogin();
                renderPosts();
                alert('관리자로 로그인되었습니다.');
            } else {
                alert('비밀번호가 올바르지 않습니다.');
            }
        }

        function closeLogin() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                isAdmin = false;
                document.getElementById('adminBadge').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('adminSection').classList.remove('active');
                renderPosts();
                alert('로그아웃되었습니다.');
            }
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result;
                    document.getElementById('previewImg').src = currentImageData;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('uploadText').textContent = file.name;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const editingId = document.getElementById('editingPostId').value;
            const postData = {
                id: editingId ? parseInt(editingId) : Date.now(),
                category: document.getElementById('category').value,
                title: document.getElementById('title').value,
                summary: document.getElementById('summary').value,
                content: document.getElementById('content').value,
                image: currentImageData || '',
                date: new Date().toLocaleDateString('ko-KR').replace(/\. /g, '.').replace('.', '.')
            };

            if (editingId) {
                const index = posts.findIndex(p => p.id === parseInt(editingId));
                posts[index] = postData;
                alert('게시글이 수정되었습니다.');
            } else {
                posts.unshift(postData);
                alert('새 게시글이 발행되었습니다.');
            }

            savePosts();
            renderPosts();
            updateCarousel();
            this.reset();
            currentImageData = null;
            document.getElementById('previewImg').style.display = 'none';
            document.getElementById('uploadText').textContent = '클릭하여 이미지 선택';
            document.getElementById('editingPostId').value = '';
            document.getElementById('formTitle').textContent = '새 글 작성';
            document.getElementById('submitBtn').textContent = '발행하기';
            document.getElementById('cancelBtn').style.display = 'none';
        });

        // 언어에 따라 게시글 데이터 가져오기
        function getPostText(post, field) {
            if (currentLang === 'en' && post[field + '_en']) {
                return post[field + '_en'];
            }
            return post[field];
        }

        // 마크다운을 HTML로 변환 (굵은체, 줄바꿈 처리)
        function parseMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')  // **굵은체** → <strong>
                .replace(/\n/g, '<br>');  // 줄바꿈 → <br>
        }

        function renderPosts() {
            const t = translations[currentLang];
            Object.keys(categoryMap).forEach(category => {
                const gridId = categoryMap[category] + '-grid';
                const grid = document.getElementById(gridId);
                const categoryPosts = posts.filter(p => p.category === category).slice(0, 5);

                if (categoryPosts.length === 0) {
                    grid.innerHTML = `<div class="empty-state">${t.empty_posts}</div>`;
                } else {
                    grid.innerHTML = categoryPosts.map(post => `
                        <div class="post-card" onclick="openModal(${post.id})">
                            <div class="post-image-wrapper ${post.image ? '' : 'no-image'}">
                                ${post.image ? `<img src="${post.image}" alt="${getPostText(post, 'title')}">` : t.no_image}
                            </div>
                            <h3 class="post-title">${getPostText(post, 'title')}</h3>
                            <p class="post-summary">${getPostText(post, 'summary')}</p>
                            <p class="post-date">${post.date}</p>
                            ${isAdmin ? `
                                <div class="admin-actions show">
                                    <button class="edit-btn" onclick="event.stopPropagation(); editPost(${post.id})">수정</button>
                                    <button class="delete-btn" onclick="event.stopPropagation(); deletePost(${post.id})">삭제</button>
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                }
            });
        }

        function openModal(postId, skipHash) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            const translatedCategory = categoryTranslations[currentLang][post.category] || post.category;
            document.getElementById('modalCategory').textContent = translatedCategory;
            document.getElementById('modalTitle').textContent = getPostText(post, 'title');
            document.getElementById('modalDate').textContent = post.date;
            document.getElementById('modalContent').innerHTML = parseMarkdown(getPostText(post, 'content'));

            const modalImage = document.getElementById('modalImage');
            if (post.image) {
                modalImage.innerHTML = `<img src="${post.image}" alt="${getPostText(post, 'title')}">`;
            } else {
                modalImage.innerHTML = '';
            }

            document.getElementById('postModal').style.display = 'block';
            document.body.style.overflow = 'hidden';

            // 공감 & 공유 버튼 표시
            currentModalPostId = postId;
            document.getElementById('modalActions').style.display = 'flex';
            updateLikeUI(postId);
            // 공유 메뉴 초기화
            document.getElementById('shareMenu').classList.remove('active');

            // SEO: hash 라우팅 업데이트
            if (!skipHash) {
                history.pushState({ type: 'post', id: postId }, '', '#/post/' + postId);
            }
            // SEO: 페이지 타이틀 업데이트
            document.title = getPostText(post, 'title') + ' — dod.mag';
            // SEO: OG 메타태그 동적 업데이트
            updateMetaTags(post);
            // SEO: Article JSON-LD 동적 생성
            updateArticleJsonLd(post);
        }

        function closeModal(skipHash) {
            document.getElementById('postModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('modalActions').style.display = 'none';
            document.getElementById('shareMenu').classList.remove('active');
            currentModalPostId = null;

            // SEO: hash 및 메타태그 복원
            if (!skipHash) {
                history.pushState({ type: 'home' }, '', window.location.pathname);
            }
            document.title = 'dod.mag — 일상의 발견';
            resetMetaTags();
            clearArticleJsonLd();
        }

        // === 공감(하트) 기능 ===
        function getLikes() {
            try {
                return JSON.parse(localStorage.getItem('dodmag_likes') || '{}');
            } catch (e) { return {}; }
        }

        function toggleLike() {
            if (!currentModalPostId) return;
            const likes = getLikes();
            const key = String(currentModalPostId);
            if (likes[key]) {
                delete likes[key];
            } else {
                likes[key] = true;
            }
            localStorage.setItem('dodmag_likes', JSON.stringify(likes));
            updateLikeUI(currentModalPostId);
        }

        function updateLikeUI(postId) {
            const likes = getLikes();
            const btn = document.getElementById('likeBtn');
            const countEl = document.getElementById('likeCount');
            const isLiked = likes[String(postId)] === true;
            if (isLiked) {
                btn.classList.add('liked');
                btn.querySelector('svg').setAttribute('fill', '#e74c3c');
                btn.querySelector('svg').setAttribute('stroke', '#e74c3c');
                countEl.textContent = '1';
            } else {
                btn.classList.remove('liked');
                btn.querySelector('svg').setAttribute('fill', 'none');
                btn.querySelector('svg').setAttribute('stroke', '#888');
                countEl.textContent = '';
            }
        }

        // === 공유하기 기능 ===
        function toggleShareMenu() {
            const menu = document.getElementById('shareMenu');
            const shareBtn = document.getElementById('shareBtn');
            if (menu.classList.contains('active')) {
                menu.classList.remove('active');
                return;
            }
            // 공유 버튼 위치 기준으로 메뉴 배치
            const rect = shareBtn.getBoundingClientRect();
            menu.style.right = (window.innerWidth - rect.left + 12) + 'px';
            menu.style.top = (rect.top - 20) + 'px';
            menu.classList.add('active');
        }

        function getShareUrl() {
            return 'https://dod-mag.pages.dev/#/post/' + currentModalPostId;
        }

        function getShareTitle() {
            return document.getElementById('modalTitle').textContent;
        }

        function shareTwitter(e) {
            e.stopPropagation();
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(getShareTitle() + ' — dod.mag');
            window.open('https://twitter.com/intent/tweet?url=' + url + '&text=' + text, '_blank', 'width=550,height=420');
            document.getElementById('shareMenu').classList.remove('active');
        }

        function shareFacebook(e) {
            e.stopPropagation();
            const url = encodeURIComponent(getShareUrl());
            window.open('https://www.facebook.com/sharer/sharer.php?u=' + url, '_blank', 'width=550,height=420');
            document.getElementById('shareMenu').classList.remove('active');
        }

        function copyLink(e) {
            e.stopPropagation();
            navigator.clipboard.writeText(getShareUrl()).then(function() {
                var toast = document.getElementById('copyToast');
                toast.textContent = currentLang === 'en' ? 'Link copied!' : '링크가 복사되었습니다';
                toast.classList.add('show');
                setTimeout(function() { toast.classList.remove('show'); }, 2000);
            });
            document.getElementById('shareMenu').classList.remove('active');
        }

        // 외부 클릭 시 공유 메뉴 닫기
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.share-btn') && !e.target.closest('.share-menu')) {
                var menu = document.getElementById('shareMenu');
                if (menu) menu.classList.remove('active');
            }
        });

        function editPost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            document.getElementById('editingPostId').value = post.id;
            document.getElementById('category').value = post.category;
            document.getElementById('title').value = post.title;
            document.getElementById('summary').value = post.summary;
            document.getElementById('content').value = post.content;

            if (post.image) {
                currentImageData = post.image;
                document.getElementById('previewImg').src = post.image;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('uploadText').textContent = '이미지 변경하기';
            }

            document.getElementById('formTitle').textContent = '게시글 수정';
            document.getElementById('submitBtn').textContent = '수정 완료';
            document.getElementById('cancelBtn').style.display = 'inline-block';

            window.scrollTo({ top: document.getElementById('adminSection').offsetTop - 100, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('postForm').reset();
            document.getElementById('editingPostId').value = '';
            document.getElementById('previewImg').style.display = 'none';
            document.getElementById('uploadText').textContent = '클릭하여 이미지 선택';
            document.getElementById('formTitle').textContent = '새 글 작성';
            document.getElementById('submitBtn').textContent = '발행하기';
            document.getElementById('cancelBtn').style.display = 'none';
            currentImageData = null;
        }

        function deletePost(postId) {
            if (confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                posts = posts.filter(p => p.id !== postId);
                savePosts();
                renderPosts();
                updateCarousel();
                alert('게시글이 삭제되었습니다.');
            }
        }

        function scrollTo(category) {
            if (category === 'all') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const section = document.getElementById(category + '-section');
                if (section) {
                    window.scrollTo({ top: section.offsetTop - 100, behavior: 'smooth' });
                }
            }
        }

        // 구독 모달 관련 함수
        function openSubscribeModal() {
            document.getElementById('subscribeModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeSubscribeModal() {
            document.getElementById('subscribeModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('subscribeForm').reset();
        }

        // ============================================
        // EmailJS 설정
        // ============================================
        // 아래 값들을 EmailJS 대시보드에서 발급받은 값으로 교체하세요
        const EMAILJS_CONFIG = {
            publicKey: 'YOUR_PUBLIC_KEY',      // EmailJS > Account > API Keys
            serviceId: 'YOUR_SERVICE_ID',      // EmailJS > Email Services
            templateId: 'YOUR_TEMPLATE_ID'     // EmailJS > Email Templates
        };

        // EmailJS 초기화
        (function() {
            if (EMAILJS_CONFIG.publicKey !== 'YOUR_PUBLIC_KEY') {
                emailjs.init(EMAILJS_CONFIG.publicKey);
            }
        })();

        // 최신 게시글 가져오기
        function getLatestPost() {
            if (posts.length === 0) return null;
            return posts[0]; // posts는 최신순 정렬되어 있음
        }

        // 이메일 본문 생성
        function formatEmailContent(post, subscriberName) {
            const contentPreview = post.content.length > 500
                ? post.content.substring(0, 500) + '...'
                : post.content;

            return `
안녕하세요, ${subscriberName}님!

dod.mag을 구독해 주셔서 진심으로 감사드립니다.
구독을 환영하며, 가장 최근 발행된 콘텐츠를 보내드립니다.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📌 [${post.category}]

${post.title}

${post.summary}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

${contentPreview}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // 웰컴 이메일 발송
        async function sendWelcomeEmail(subscriberData) {
            // EmailJS 설정이 안 되어 있으면 스킵
            if (EMAILJS_CONFIG.publicKey === 'YOUR_PUBLIC_KEY') {
                console.log('EmailJS 설정이 필요합니다. EMAILJS_CONFIG 값을 설정해주세요.');
                return { success: false, reason: 'not_configured' };
            }

            const latestPost = getLatestPost();
            if (!latestPost) {
                console.log('발송할 게시글이 없습니다.');
                return { success: false, reason: 'no_posts' };
            }

            const emailContent = formatEmailContent(latestPost, subscriberData.name);

            const templateParams = {
                to_email: subscriberData.email,
                to_name: subscriberData.name,
                subject: `[dod.mag] ${subscriberData.name}님, 구독을 환영합니다! 🎉`,
                post_category: latestPost.category,
                post_title: latestPost.title,
                post_summary: latestPost.summary,
                post_date: latestPost.date,
                message: emailContent
            };

            try {
                const response = await emailjs.send(
                    EMAILJS_CONFIG.serviceId,
                    EMAILJS_CONFIG.templateId,
                    templateParams
                );
                console.log('이메일 발송 성공:', response);
                return { success: true, response };
            } catch (error) {
                console.error('이메일 발송 실패:', error);
                return { success: false, error };
            }
        }

        document.getElementById('subscribeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.querySelector('.submit-subscribe-btn');
            const originalText = submitBtn.textContent;

            const subscribeData = {
                name: document.getElementById('subscribeName').value,
                email: document.getElementById('subscribeEmail').value,
                company: document.getElementById('subscribeCompany').value,
                agreedToMarketing: document.getElementById('agreeCheckbox').checked,
                subscribedAt: new Date().toISOString()
            };

            // LocalStorage에 구독자 목록 저장
            let subscribers = JSON.parse(localStorage.getItem('dodmagSubscribers') || '[]');

            // 중복 이메일 체크
            const existingSubscriber = subscribers.find(s => s.email === subscribeData.email);
            if (existingSubscriber) {
                alert('이미 구독하신 이메일입니다.');
                return;
            }

            // 버튼 로딩 상태
            submitBtn.textContent = '발송 중...';
            submitBtn.disabled = true;

            // 이메일 발송 시도
            const emailResult = await sendWelcomeEmail(subscribeData);

            // 구독자 저장 (이메일 발송 성공 여부와 관계없이)
            subscribers.push(subscribeData);
            localStorage.setItem('dodmagSubscribers', JSON.stringify(subscribers));

            // 버튼 원복
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;

            // 결과 메시지
            if (emailResult.success) {
                alert(`구독해 주셔서 감사합니다, ${subscribeData.name}님!\n\n입력하신 이메일(${subscribeData.email})로\n최신 콘텐츠를 발송해 드렸습니다.\n\n받은편지함을 확인해 주세요.`);

        function openCategoryPage(category, skipHash) {

            document.getElementById('categoryPageTitle').textContent = translatedCategory;

            } else {

                    <div class="post-card" onclick="openModal(${post.id})">
                        <div class="post-image-wrapper ${post.image ? '' : 'no-image'}">

                cat_desc_life: 'Useful information about everyday wellness, health, and self-care.',
                cat_desc_brands: 'Exploring the stories and philosophies of inspiring brands.',
                footer_privacy: 'Privacy Policy',
                footer_terms: 'Terms of Service',
                privacy_title: 'Privacy Policy',
                terms_title: 'Terms of Service'
            },
        };

        const categoryTranslations = {
            ko: { '경제': '경제' },
            en: { '경제': 'Economy' }
        };

        function setLanguage(lang) {
            currentLang = lang;

            // 버튼 활성화 상태 업데이트
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === lang.toUpperCase() ||
                    (lang === 'zh' && btn.textContent === '中')) {
                    btn.classList.add('active');
                }
            });

            // 정적 텍스트 번역
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.innerHTML = t[key];
                    }
                }
            });

            // 구독 모달 텍스트
            document.querySelector('.subscribe-logo').textContent = t.subscribe_title;
            document.querySelector('.subscribe-description').innerHTML = t.subscribe_desc;
            document.querySelector('.submit-subscribe-btn').textContent = t.btn_subscribe;
            document.querySelector('.close-subscribe-btn').textContent = t.btn_cancel;

            // 폼 라벨
            const formLabels = document.querySelectorAll('.subscribe-form .form-label');
            if (formLabels[0]) formLabels[0].textContent = t.form_name;
            if (formLabels[1]) formLabels[1].textContent = t.form_email;
            if (formLabels[2]) formLabels[2].textContent = t.form_company;

            // 체크박스 라벨
            document.querySelector('.checkbox-label').textContent = t.form_agree;

            // 로그인 모달
            document.querySelector('.login-title').textContent = t.login_title;
            document.querySelector('.login-input').placeholder = t.login_placeholder;
            document.querySelector('.login-btn').textContent = t.btn_login;
            document.querySelector('.cancel-btn').textContent = t.btn_cancel;

            // 관리자 배지
            document.getElementById('adminBadge').textContent = t.admin_badge;

            // 카테고리 설명 업데이트
            categoryDescriptions['경제'] = t.cat_desc_products;

            // 약관 페이지 제목 업데이트
            document.getElementById('privacyTitle').textContent = t.privacy_title;
            document.getElementById('termsTitle').textContent = t.terms_title;

            // 게시글 다시 렌더링
            renderPosts();
            updateCarousel();

            // 현재 열린 카테고리 페이지가 있으면 업데이트
            if (document.getElementById('categoryPage').classList.contains('active')) {
                const currentTitle = document.getElementById('categoryPageTitle').textContent;
                // 원래 카테고리명 찾기 (모든 언어에서 검색)
                let originalCategory = null;
                for (const cat of Object.keys(categoryTranslations.ko)) {
                    if (categoryTranslations.ko[cat] === currentTitle ||
                        categoryTranslations.en[cat] === currentTitle) {
                        originalCategory = cat;
                        break;
                    }
                }

                if (originalCategory) {
                    // 카테고리 페이지 다시 렌더링
                    openCategoryPage(originalCategory);
                }
            }

            localStorage.setItem('dodmagLang', lang);
        }

        // ============================================
        // SEO: 메타태그 동적 업데이트 함수
        // ============================================
        const defaultMeta = {
            title: 'dod.mag — 일상의 발견',
            description: '20-30대 여성을 위한 라이프스타일 매거진. 트렌드, 뷰티, 라이프, 브랜드 인사이트를 전합니다.',
            image: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=1200&h=630&fit=crop',
            url: 'https://dod-mag.pages.dev'
        };

        function updateMetaTags(post) {
            const title = getPostText(post, 'title') + ' — dod.mag';
            const desc = getPostText(post, 'summary');
            const image = post.image || defaultMeta.image;
            const url = 'https://dod-mag.pages.dev/#/post/' + post.id;

            document.querySelector('meta[property="og:title"]').setAttribute('content', title);
            document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
            document.querySelector('meta[property="og:image"]').setAttribute('content', image);
            document.querySelector('meta[property="og:url"]').setAttribute('content', url);
            document.querySelector('meta[property="og:type"]').setAttribute('content', 'article');
            document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
            document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);
            document.querySelector('meta[name="twitter:image"]').setAttribute('content', image);
            document.querySelector('meta[name="description"]').setAttribute('content', desc);
            document.querySelector('link[rel="canonical"]').setAttribute('href', url);
        }

        function resetMetaTags() {
            document.querySelector('meta[property="og:title"]').setAttribute('content', defaultMeta.title);
            document.querySelector('meta[property="og:description"]').setAttribute('content', defaultMeta.description);
            document.querySelector('meta[property="og:image"]').setAttribute('content', defaultMeta.image);
            document.querySelector('meta[property="og:url"]').setAttribute('content', defaultMeta.url);
            document.querySelector('meta[property="og:type"]').setAttribute('content', 'website');
            document.querySelector('meta[name="twitter:title"]').setAttribute('content', defaultMeta.title);
            document.querySelector('meta[name="twitter:description"]').setAttribute('content', defaultMeta.description);
            document.querySelector('meta[name="twitter:image"]').setAttribute('content', defaultMeta.image);
            document.querySelector('meta[name="description"]').setAttribute('content', defaultMeta.description);
            document.querySelector('link[rel="canonical"]').setAttribute('href', defaultMeta.url + '/');
        }

        function updateArticleJsonLd(post) {
            const jsonLd = {
                "@context": "https://schema.org",
                "@type": "Article",
                "headline": getPostText(post, 'title'),
                "description": getPostText(post, 'summary'),
                "image": post.image || defaultMeta.image,
                "datePublished": post.date.replace(/\./g, '-'),
                "author": { "@type": "Organization", "name": "dod.mag" },
                "publisher": {
                    "@type": "Organization",
                    "name": "dod.mag",
                    "logo": { "@type": "ImageObject", "url": "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600&h=600&fit=crop" }
                },
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": "https://dod-mag.pages.dev/#/post/" + post.id
                }
            };
            document.getElementById('articleJsonLd').textContent = JSON.stringify(jsonLd);
        }

        function clearArticleJsonLd() {
            document.getElementById('articleJsonLd').textContent = '';
        }

        // ============================================
        // SEO: hash 기반 라우팅
        // ============================================
        function handleHashRoute() {
            const hash = window.location.hash;
            if (!hash) return;

            // #/post/{id} 패턴
            const postMatch = hash.match(/^#\/post\/(\d+)$/);
            if (postMatch) {
                const postId = parseInt(postMatch[1]);
                if (posts && posts.length > 0) {
                    openModal(postId, true);
                }
                return;
            }

            // #/category/{name} 패턴
            const catMatch = hash.match(/^#\/category\/(.+)$/);
            if (catMatch) {
                const category = decodeURIComponent(catMatch[1]);
                if (posts && posts.length > 0) {
                    openCategoryPage(category, true);
                }
                return;
            }
        }

        // 브라우저 뒤로가기/앞으로가기 대응
        window.addEventListener('popstate', function(e) {
            const state = e.state;
            // 먼저 모든 것을 닫기
            document.getElementById('postModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('categoryPage').classList.remove('active');
            document.querySelector('.hero-banner').style.display = 'block';
            document.querySelector('.container').style.display = 'block';
            document.getElementById('mainFooter').style.display = 'block';
            if (isAdmin) {
                document.getElementById('adminSection').style.display = 'block';
            }
            document.title = 'dod.mag — 일상의 발견';
            resetMetaTags();
            clearArticleJsonLd();

            // hash가 있으면 해당 콘텐츠 표시
            handleHashRoute();
        });

        // 페이지 로드 시 초기화
        window.addEventListener('load', async function() {
            await loadPosts();
            renderPosts();
            updateCarousel();
            loadLegalContent();

            // 저장된 언어 설정 불러오기
            const savedLang = localStorage.getItem('dodmagLang');
            if (savedLang && savedLang !== 'ko') {
                setLanguage(savedLang);
            }

            // SEO: 초기 hash 라우팅 처리
            handleHashRoute();
        });
    </script>
</body>
</html>
